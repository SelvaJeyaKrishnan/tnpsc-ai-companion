services:
  # -------------------------------------------------------------
  # Backend API Service (FastAPI)
  # -------------------------------------------------------------
  - type: web
    name: tnpsc-companion-api
    runtime: python
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        sync: false # Set to your deployed Vercel frontend URL, e.g. https://tnpsc-companion.vercel.app
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: DATABASE_URL
        fromDatabase:
          name: tnpsc-postgres-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false # Optional: Add your Google Gemini API key

# -------------------------------------------------------------
# Managed PostgreSQL Database
# -------------------------------------------------------------
databases:
  - name: tnpsc-postgres-db
    databaseName: tnpsc_companion
    user: tnpsc_admin
    plan: free
